<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 170 170" fill="none">
  <defs>
    <linearGradient id="lifeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"></stop>
      <stop offset="100%" stop-color="#16A34A"></stop>
    </linearGradient>
    <linearGradient id="lifeGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"></stop>
      <stop offset="100%" stop-color="#22C55E"></stop>
    </linearGradient>
  </defs>
  <style>
    .icon-g {
      stroke: url(#lifeGradient);
      fill: url(#lifeGradient);
    }
    .icon-hole {
      fill: white;
    }
    @media (prefers-color-scheme: dark) {
      .icon-g {
        stroke: url(#lifeGradientDark);
        fill: url(#lifeGradientDark);
      }
    }
  </style>

  <g transform="translate(25,25)">
    <line x1="65" y1="65" x2="25" y2="25" class="icon-g" stroke-width="5"></line>
    <line x1="65" y1="65" x2="105" y2="25" class="icon-g" stroke-width="5"></line>
    <line x1="65" y1="65" x2="25" y2="105" class="icon-g" stroke-width="5"></line>
    <line x1="65" y1="65" x2="105" y2="105" class="icon-g" stroke-width="5"></line>

    <circle cx="65" cy="65" r="22" class="icon-g"></circle>

    <rect x="12" y="12" width="26" height="26" rx="8" class="icon-hole" stroke="url(#lifeGradient)" stroke-width="3"></rect>
    <rect x="92" y="12" width="26" height="26" rx="8" class="icon-hole" stroke="url(#lifeGradient)" stroke-width="3"></rect>
    <rect x="12" y="92" width="26" height="26" rx="8" class="icon-hole" stroke="url(#lifeGradient)" stroke-width="3"></rect>
    <rect x="92" y="92" width="26" height="26" rx="8" class="icon-hole" stroke="url(#lifeGradient)" stroke-width="3"></rect>

    <circle cx="65" cy="65" r="8" class="icon-hole"></circle>
  </g>
</svg>
